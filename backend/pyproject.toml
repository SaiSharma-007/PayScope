[project]
name = "payscope"
version = "0.1.0"
description = "PayScope salary management API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.31,<1",
    "faker>=40,<41",
    "fastapi>=0.165,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "redis>=8.1,<9",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx2>=2.16.2,<3", "pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
